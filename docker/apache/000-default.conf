<VirtualHost *:80>
    ServerName site5.local
    DocumentRoot /var/www/html

    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_proxy_fcgi.c>
        <Proxy fcgi://php-fpm:9000>
            ProxySet connectiontimeout=5 timeout=120
        </Proxy>
        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://php-fpm:9000"
        </FilesMatch>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/site5-error.log
    CustomLog ${APACHE_LOG_DIR}/site5-access.log combined
</VirtualHost>
